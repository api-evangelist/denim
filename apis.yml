aid: denim
name: Denim
description: >-
  Denim (denim.com, formerly Axle Payments) is an all-in-one financial and back-office
  platform for freight brokers, trucking companies, and 3PLs. It provides freight
  factoring, invoicing, collections, carrier payments, and a fuel card, automating the
  broker back office and syncing two ways with transportation management systems. The
  Denim Public API (OpenAPI 3.0) exposes freight loads (jobs), debtors, payees, companies,
  factoring companies, and transactions, secured with an x-api-key header, so partners can
  create and quote jobs, onboard debtor/payee relationships, and reconcile transactions
  programmatically. Added to the API Evangelist network as a portfolio-company lead and
  enriched from the provider's public developer surface.
