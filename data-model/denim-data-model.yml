    description: The party paid for a load (carrier / vendor), optionally with an assigned factor.
    schemas: [Payee, Payee Company, Payee Create, Payee Factor Company, Client-Payee Relationship]
  - name: Company
    description: A generic company record; clients, debtors, payees and factors are all companies.
    schemas: [Generic Company, Company Index Response]
  - name: FactoringCompany
    description: A factoring company that can be assigned to a payee relationship.
    schemas: [Factoring Company, Factoring Company Index Response]
  - name: Obligation
    description: A receivable or payable tied to a job.
    schemas: [Receivable Obligation, Payable Obligation, Job Obligation, Obligation Line Item, Obligation Document]
  - name: Transaction
    description: A money movement applied against obligations.
    schemas: [Transaction, Transaction Applied, Transaction Metadata, Transaction Index Response]
  - name: Document
    description: A document (rate confirmation, BOL, invoice) attached to a job.
    schemas: [Job Document, Add a document to a job, Upload a document to a job]
