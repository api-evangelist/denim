    Add a document to a job:
      description: Provide a publically available `url` to a PDF, PNG, or JPEG documents associated with a job. Files are downloaded and then uploaded to our secure storage.
      properties:
        subtype:
          description: Billing or supporting paperwork subtype. Optional
          enum:
          - purchase_order
          - proof_of_work
          - invoice
          nullable: true
          type: string
        type:
          description: Billing paperwork gets sent to debtor. Supporting paperwork allows us to pay the carrier.
          enum:
          - billing_paperwork
          - supporting_paperwork
          type: string
        url:
          description: 'Full remote URL of document file to be downloaded and uploaded to our secure storage. Content-Type header is required in response. Allowed Content-Type values: application/pdf, image/png and image/jpeg.'
          type: string
      title: Add a document to a job
      type: object
    Job Create Request:
      description: Request body for creating a job
      example:
        documents:
        - subtype: proof_of_work
          type: billing_paperwork
          url: https://example.com/samples/sample_files/sample_document.pdf
        - subtype: invoice
          type: supporting_paperwork
          url: https://example.com/samples/sample_files/sample_document.pdf
        is_factored: true
        notes: There was a lumper fee
        obligations:
        - client_payee_relationship_id: 21
          due_date: '2020-02-26T15:34:22Z'
          obligation_date: '2020-01-26T15:34:22Z'
          reference_number: ''
          subtype: primary
          total_amount: 80000
          type: payable
        - client_debtor_relationship_id: 30
          due_date: '2020-03-26T04:00:00Z'
          line_items:
          - amount: 89000
            description: Invoice Price
            type: base_amount
          - amount: 9000
            description: Lumper Fee
            type: accessorial_fee
          - amount: 2000
            description: Fuel Surcharge
            type: accessorial_fee
          obligation_date: '2020-02-26T04:00:00Z'
          reference_number: ''
          subtype: primary
          total_amount: 100000
          type: receivable
        reference_number: test-123
